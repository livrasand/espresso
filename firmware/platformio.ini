[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; default partition table only allows a 1.25MB app partition;
; the firmware exceeds it, so use the 3MB huge_app layout
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    davylandman/Monocypher@^2.0.6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DED25519_SHA512
    -I$PROJECT_SRC_DIR
board_build.filesystem = littlefs
